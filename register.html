<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta · Electro Shop</title>
  <meta name="description" content="Criar conta na Electro Shop.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2547d0">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/account.css">
</head>
<body data-wa-source="SUPPORT" data-auth="register">
  <header id="site-header"></header>
  <main id="main" tabindex="-1">
    <div class="container auth">
      <section class="auth__card panel" id="auth-card" aria-labelledby="auth-title">
        <h1 id="auth-title">Criar conta</h1>
        
        <form id="auth-form" method="post" novalidate>
          <div class="form-error" role="alert" tabindex="-1"></div>
          <div class="field"><label for="name">Nome completo</label><input class="input" id="name" name="name" required minlength="2" maxlength="120" autocomplete="name"></div>
          <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" required autocomplete="email" inputmode="email"></div>
          <div class="field"><label for="phone">Telefone</label><input class="input" id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="84 123 4567"><span class="field__hint">Opcional. Sem indicativo assumimos +258.</span></div>
        <div class="field"><label for="password">Password</label>
          <div class="pw"><input class="input" id="password" name="password" type="password" required autocomplete="new-password" maxlength="128"><button class="link-btn pw__toggle" type="button" data-toggle-pw="password" aria-pressed="false" aria-label="Mostrar password">Mostrar</button></div><span class="field__hint">Mínimo 8 caracteres, com letras e números.</span></div>
        <div class="field"><label for="confirm">Confirmar password</label>
          <div class="pw"><input class="input" id="confirm" name="confirm" type="password" required autocomplete="new-password" maxlength="128"><button class="link-btn pw__toggle" type="button" data-toggle-pw="confirm" aria-pressed="false" aria-label="Mostrar password">Mostrar</button></div></div>
          <button class="btn btn--primary btn--block btn--lg" type="submit" disabled data-needs-js>Criar conta</button>
          <p class="field__hint" style="margin-top:12px">Ao criar conta aceita os <a href="help.html#termos">termos</a> e a <a href="help.html#privacidade">política de privacidade</a>.</p>
        </form>
        <p class="auth__switch">Já tem conta? <a href="login.html">Entrar</a></p>
      </section>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <noscript><p class="container">Esta loja precisa de JavaScript ativo.</p></noscript>
  <script type="module" src="js/pages/auth.js"></script>
</body>
</html>
