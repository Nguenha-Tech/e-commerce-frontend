<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contactos · Electro Shop</title>
  <meta name="description" content="Fale connosco por WhatsApp, telefone ou email.">
  <meta name="theme-color" content="#2547d0">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/account.css">
</head>
<body data-wa-source="CONTACT">
  <header id="site-header"></header>
  <main id="main" tabindex="-1">
    <div class="container">
      <div class="page-head"><h1>Contactos</h1><p>Estamos disponíveis para ajudar com produtos, pedidos, entregas e garantias.</p></div>
      <div class="contact">
        <section class="panel" aria-labelledby="h-channels"><h2 class="panel__title" id="h-channels">Canais de atendimento</h2><div id="contact-info"><div class="sk-stack"><div class="sk sk--line"></div><div class="sk sk--line"></div></div></div></section>
        <section class="panel" aria-labelledby="h-form">
          <h2 class="panel__title" id="h-form">Enviar mensagem</h2>
          <form id="contact-form">
            <div class="field"><label for="c-name">Nome</label><input class="input" id="c-name" name="name" required autocomplete="name"></div>
            <div class="field"><label for="c-subject">Assunto</label><select class="select" id="c-subject" name="subject"><option>Informação sobre produto</option><option>Estado de um pedido</option><option>Entregas</option><option>Garantia e devoluções</option><option>Outro</option></select></div>
            <div class="field"><label for="c-msg">Mensagem</label><textarea class="textarea" id="c-msg" name="message" required minlength="5" maxlength="1500"></textarea></div>
            <button class="btn btn--whatsapp btn--lg" type="submit">Enviar pelo WhatsApp</button>
            <p class="field__hint" style="margin-top:8px">A mensagem é aberta no WhatsApp para a enviar ao número oficial da loja.</p>
          </form>
        </section>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <noscript><p class="container">Esta loja precisa de JavaScript ativo.</p></noscript>
  <script type="module" src="js/pages/contact.js"></script>
</body>
</html>
