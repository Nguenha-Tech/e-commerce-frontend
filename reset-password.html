<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Definir nova password · Electro Shop</title>
  <meta name="description" content="Definir nova password na Electro Shop.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2547d0">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/account.css">
</head>
<body data-wa-source="SUPPORT" data-auth="reset">
  <header id="site-header"></header>
  <main id="main" tabindex="-1">
    <div class="container auth">
      <section class="auth__card panel" id="auth-card" aria-labelledby="auth-title">
        <h1 id="auth-title">Definir nova password</h1>
        
        <form id="auth-form" method="post" novalidate>
          <div class="form-error" role="alert" tabindex="-1"></div>
        <div class="field"><label for="password">Nova password</label>
          <div class="pw"><input class="input" id="password" name="password" type="password" required autocomplete="new-password" maxlength="128"><button class="link-btn pw__toggle" type="button" data-toggle-pw="password" aria-pressed="false" aria-label="Mostrar password">Mostrar</button></div><span class="field__hint">Mínimo 8 caracteres, com letras e números.</span></div>
        <div class="field"><label for="confirm">Confirmar password</label>
          <div class="pw"><input class="input" id="confirm" name="confirm" type="password" required autocomplete="new-password" maxlength="128"><button class="link-btn pw__toggle" type="button" data-toggle-pw="confirm" aria-pressed="false" aria-label="Mostrar password">Mostrar</button></div></div>
          <button class="btn btn--primary btn--block btn--lg" type="submit" disabled data-needs-js>Guardar password</button>
        </form>
      </section>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <noscript><p class="container">Esta loja precisa de JavaScript ativo.</p></noscript>
  <script type="module" src="js/pages/auth.js"></script>
</body>
</html>
